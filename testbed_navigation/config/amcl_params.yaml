amcl:
  ros__parameters:
    use_sim_time: true

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"

    scan_topic: "scan"

    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    laser_model_type: "likelihood_field"

    laser_min_range: -1.0
    laser_max_range: 15.0
    laser_likelihood_max_dist: 2.0

    max_beams: 60
    min_particles: 500
    max_particles: 2000

    update_min_d: 0.25
    update_min_a: 0.2

    transform_tolerance: 1.0
    tf_broadcast: true

    resample_interval: 1

    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    lambda_short: 0.1

    pf_err: 0.05
    pf_z: 0.99

    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
